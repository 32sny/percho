name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -w packages/desktop -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            packages/desktop/dist/*
            !packages/desktop/dist/mac
            !packages/desktop/dist/mac-arm64
            !packages/desktop/dist/win-unpacked
            !packages/desktop/dist/linux-unpacked
            !packages/desktop/dist/builder-debug.yml
          if-no-files-found: warn
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* -R "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file - <<'EOF'
          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon) | `percho-mac-arm64.dmg` |
          | macOS (Intel) | `percho-mac-x64.dmg` |
          | Windows | `percho-windows-x64.exe` |
          | Windows (zip) | `percho-windows-x64.zip` |
          | Linux (x64) | `percho-linux-x86_64.AppImage` |

          > Ad-hoc signed (no Developer ID).
          > On macOS, if Gatekeeper blocks the app, right-click and Open.
          > Windows and Linux builds update automatically in-app.
          EOF
